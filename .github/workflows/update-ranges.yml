name: update Cloudflare ranges

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      # Fails the workflow when the fetch or validation fails, so a broken source
      # is noticed rather than leaving the snapshot quietly old.
      - name: Fetch and validate the ranges
        run: php bin/update-ranges

      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          branch: update-cloudflare-ranges
          title: 'fix: update Cloudflare ranges'
          commit-message: 'fix: update Cloudflare ranges'
          body: |
            Cloudflare's published ranges ([IPv4](https://www.cloudflare.com/ips-v4), [IPv6](https://www.cloudflare.com/ips-v6)) changed. Every entry was validated as a CIDR outside private and reserved space.

            Merging lets release-please cut a patch release.
          add-paths: resources/cloudflare-ips.json
          delete-branch: true

      # A PR opened with GITHUB_TOKEN does not trigger other workflows, but
      # workflow_dispatch is exempt. The runs attach to the PR's head commit.
      - name: Run CI on the PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run tests.yml --ref update-cloudflare-ranges
        env:
          GH_TOKEN: ${{ github.token }}
